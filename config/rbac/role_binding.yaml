apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubtenant-manager-rolebinding
  labels:
    app.kubernetes.io/name: kubtenant
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubtenant-manager-role
subjects:
- kind: ServiceAccount
  name: kubtenant-controller-manager
  namespace: kubtenant-system
---
# Leader-election lease permissions, scoped to the controller's own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubtenant-leader-election-role
  namespace: kubtenant-system
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubtenant-leader-election-rolebinding
  namespace: kubtenant-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubtenant-leader-election-role
subjects:
- kind: ServiceAccount
  name: kubtenant-controller-manager
  namespace: kubtenant-system
