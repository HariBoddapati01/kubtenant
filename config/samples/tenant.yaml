apiVersion: platform.hariboddapati.dev/v1beta1
kind: Tenant
metadata:
  name: acme
spec:
  displayName: "ACME Corp"
  # Namespaces provisioned and owned by this tenant. Deleting the Tenant
  # garbage-collects them via owner references.
  namespaces:
    - acme-dev
    - acme-staging
    - acme-prod
  # RBAC subjects granted the ownerRole (namespace-scoped) in every namespace.
  owners:
    - kind: Group
      name: acme-platform-admins
    - kind: User
      name: jane@acme.example
  ownerRole: admin
  # Per-namespace aggregate resource ceiling.
  resourceQuota:
    cpu: "16"
    memory: 32Gi
    pods: "80"
  # Default container requests/limits so unbounded pods can't starve the node,
  # plus per-container maxima and PVC size bounds.
  limitRange:
    defaultCPU: 500m
    defaultMemory: 512Mi
    defaultRequestCPU: 100m
    defaultRequestMemory: 128Mi
    maxCPU: "4"
    maxMemory: 8Gi
    minPVCStorage: 1Gi
    maxPVCStorage: 100Gi
  # Default-deny ingress AND egress, allow-same-tenant both ways, allow DNS.
  networkIsolation: true
  # Enforce the "restricted" Pod Security Standard in every tenant namespace.
  podSecurity: restricted
  # Provision a tenant PriorityClass (kubtenant-acme) and forbid pods from
  # using any other explicit priority class in tenant namespaces.
  priorityClass:
    value: 1000
    description: "ACME workloads"
    restrict: true
