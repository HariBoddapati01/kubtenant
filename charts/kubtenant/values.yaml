image:
  repository: ghcr.io/hariboddapati01/kubtenant
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

leaderElection:
  enabled: true

serviceAccount:
  # Name of the ServiceAccount to create.
  name: kubtenant-controller-manager

metrics:
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
