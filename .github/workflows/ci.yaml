name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Verify generated code is up to date
        run: |
          go run sigs.k8s.io/controller-tools/cmd/controller-gen@v0.21.0 object:headerFile=/dev/null paths=./api/...
          go run sigs.k8s.io/controller-tools/cmd/controller-gen@v0.21.0 crd rbac:roleName=kubtenant-manager-role paths=./... \
            output:crd:artifacts:config=config/crd/bases output:rbac:artifacts:config=config/rbac
          git diff --exit-code || (echo "::error::generated code is stale; run 'make generate manifests'" && exit 1)
      - name: go vet
        run: go vet ./...
      - name: unit tests
        run: go test ./... -race -coverprofile=cover.out
      - name: build
        run: go build ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      # Run golangci-lint (v2) via `go run` so it is compiled with the runner's
      # own Go toolchain. A prebuilt action binary can lag the module's Go
      # version and refuse to lint it; building from source avoids that skew.
      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest run ./...

  integration:
    name: envtest integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Run integration tests against a real kube-apiserver
        run: make test-integration

  helm:
    name: helm lint + chart CRD drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint charts/kubtenant
      - name: chart CRD matches config/crd
        run: |
          diff -u config/crd/bases/platform.hariboddapati.dev_tenants.yaml \
            charts/kubtenant/crds/platform.hariboddapati.dev_tenants.yaml \
            || (echo "::error::chart CRD is stale; run 'cp config/crd/bases/*.yaml charts/kubtenant/crds/'" && exit 1)

  image:
    name: build image (multi-arch)
    runs-on: ubuntu-latest
    needs: [ test, lint ]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Both release platforms, no push: proves the cross-compile path on
      # every PR so a Dockerfile change can't break the release job later.
      # No QEMU needed: the builder stage runs on $BUILDPLATFORM and the
      # runtime stage is a distroless COPY with no RUN steps.
      - name: Build container image for linux/amd64,linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: kubtenant:ci

  e2e:
    name: kind e2e (make demo)
    runs-on: ubuntu-latest
    needs: [ test, lint, helm ]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: kubtenant-demo
          install_only: true
      - name: Run the demo as e2e
        run: KEEP=false make demo
